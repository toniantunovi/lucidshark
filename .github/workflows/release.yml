name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Fail fast if the tag, lucidshark.__version__ and server.json disagree.
  # The PyPI version is read from __version__ and the MCP Registry entry from
  # server.json, so a drift would publish mismatched artifacts.
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check tag matches __version__ and server.json
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import ast,pathlib; t=ast.parse(pathlib.Path('src/lucidshark/__init__.py').read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and any(getattr(x, 'id', '') == '__version__' for x in n.targets)))")
          srv=$(jq -r '.version' server.json)
          srv_pkgs=$(jq -r '[.packages[].version] | unique | join(",")' server.json)
          echo "tag=$tag __version__=$pkg server.json=$srv packages=$srv_pkgs"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srv_pkgs" ]; then
            echo "::error::Tag v$tag does not match __version__ ($pkg) / server.json ($srv, packages $srv_pkgs)"
            exit 1
          fi

  # Run quality checks (includes tests) across platforms before releasing
  quality-check:
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # Install lucidshark in editable mode to register entry points
          pip install -e .

      - name: Build binary with PyInstaller
        run: |
          pyinstaller lucidshark.spec --clean

      - name: Run LucidShark quality scan
        run: |
          ./dist/lucidshark --verbose scan --all --all-files --format summary

  # Build standalone binaries for all platforms
  # Build Linux binaries in a Debian 12 container (glibc 2.36) for broad compatibility.
  # This avoids requiring glibc 2.38+ which ubuntu-latest (24.04) would produce.
  # Debian 11 was used until 0.8.1, but its security pool no longer serves the
  # point-release .debs the image indexes, so apt-get install 404s on every build.
  build-binaries:
    needs: [quality-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            artifact_name: lucidshark
            asset_name: lucidshark-linux-amd64
            container: python:3.11-slim-bookworm
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact_name: lucidshark
            asset_name: lucidshark-linux-arm64
            container: python:3.11-slim-bookworm
          - os: macos-15-intel
            target: darwin-amd64
            artifact_name: lucidshark
            asset_name: lucidshark-darwin-amd64
          - os: macos-latest
            target: darwin-arm64
            artifact_name: lucidshark
            asset_name: lucidshark-darwin-arm64

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}

    steps:
      - name: Install build dependencies (container)
        if: ${{ matrix.container }}
        run: apt-get update && apt-get install -y --no-install-recommends git binutils

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (native runner)
        if: ${{ !matrix.container }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # Install lucidshark in editable mode to register entry points
          pip install -e .

      - name: Build binary with PyInstaller
        run: pyinstaller lucidshark.spec --clean

      - name: Rename binary for upload
        shell: bash
        run: mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  # Create GitHub Release with binaries
  create-release:
    needs: [quality-check, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # sign build provenance via Sigstore
      attestations: write  # store the attestation on GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read versions for release notes
        id: versions
        run: |
          echo "trivy=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['lucidshark']['tools']['trivy'])")" >> $GITHUB_OUTPUT
          echo "opengrep=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['lucidshark']['tools']['opengrep'])")" >> $GITHUB_OUTPUT
          echo "checkov=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['lucidshark']['tools']['checkov'])")" >> $GITHUB_OUTPUT
          echo "gosec=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['lucidshark']['tools']['gosec'])")" >> $GITHUB_OUTPUT

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: binaries
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la binaries/

      - name: Generate SHA256SUMS
        working-directory: binaries
        run: |
          sha256sum lucidshark-linux-amd64 lucidshark-linux-arm64 \
                    lucidshark-darwin-amd64 lucidshark-darwin-arm64 > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            binaries/lucidshark-linux-amd64
            binaries/lucidshark-linux-arm64
            binaries/lucidshark-darwin-amd64
            binaries/lucidshark-darwin-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            binaries/lucidshark-linux-amd64
            binaries/lucidshark-linux-arm64
            binaries/lucidshark-darwin-amd64
            binaries/lucidshark-darwin-arm64
            binaries/SHA256SUMS
          body: |
            ## LucidShark - The Trust Layer for AI-Assisted Development

            LucidShark unifies code quality tools (linting, type checking, security, testing, coverage) into a single pipeline that auto-configures for any project and integrates with AI coding tools like Claude Code and Cursor.

            ## Installation

            **Linux/macOS:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/toniantunovi/lucidshark/main/install.sh | bash
            ```

            The installer verifies the binary against `SHA256SUMS` before installing it.

            **Manual download:** See the assets below for pre-built binaries for your platform. Verify before running:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing          # Linux
            shasum -a 256 -c SHA256SUMS --ignore-missing      # macOS
            gh attestation verify lucidshark-<platform> --repo toniantunovi/lucidshark   # build provenance
            ```

            On first run, plugins automatically download their binaries for your platform. Every tool download is checked against a SHA-256 pinned inside LucidShark and rejected on mismatch.

            ## Features

            - **Security Scanning**: Trivy (SCA), OpenGrep (SAST), gosec (Go SAST), Checkov (IaC)
            - **Linting**: Ruff, ESLint, Biome, Clippy, Checkstyle
            - **Formatting**: Ruff Format, Prettier, rustfmt, gofmt
            - **Type Checking**: mypy, pyright, TypeScript
            - **Testing**: pytest, Jest
            - **Coverage**: coverage.py, Istanbul
            - **AI Integration**: MCP server for Claude Code and Cursor

            ## Quick Start

            ```bash
            # Initialize project
            ./lucidshark init

            # Run all checks
            ./lucidshark scan --all

            # Run specific domains
            ./lucidshark scan --linting --type-checking --testing --coverage

            # Auto-fix linting issues
            ./lucidshark scan --linting --fix

            # MCP server for AI tools
            ./lucidshark serve
            ```

            ## AI Tool Integration

            Add to your Claude Code or Cursor MCP configuration:

            ```json
            {
              "mcpServers": {
                "lucidshark": {
                  "command": "./lucidshark",
                  "args": ["serve"]
                }
              }
            }
            ```

            ## Default Scanner Plugin Versions

            | Scanner Plugin | Version |
            |----------------|---------|
            | Trivy | ${{ steps.versions.outputs.trivy }} |
            | OpenGrep | ${{ steps.versions.outputs.opengrep }} |
            | gosec | ${{ steps.versions.outputs.gosec }} |
            | Checkov | ${{ steps.versions.outputs.checkov }} |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the sdist and wheel that go to PyPI. The version comes from
  # lucidshark.__version__ (pyproject.toml declares it dynamic).
  build-python-dist:
    needs: [verify-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          test "$(/tmp/wheel-venv/bin/lucidshark --version)" = "${GITHUB_REF_NAME#v}"
          /tmp/wheel-venv/bin/lucidshark help > /dev/null

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  # Publish to PyPI with Trusted Publishing (OIDC, no API token). Runs only
  # after the GitHub Release exists, because PyPI versions are immutable and
  # a half-failed release should not leave a PyPI upload behind.
  publish-pypi:
    needs: [build-python-dist, create-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lucidshark
    permissions:
      contents: read
      id-token: write  # mandatory for PyPI Trusted Publishing

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Publish server.json to the official MCP Registry. The registry validates
  # PyPI ownership by looking for the mcp-name marker in the package's long
  # description, so this must run after the PyPI upload is visible.
  # Flow: https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
  publish-mcp-registry:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # GitHub OIDC login to the MCP Registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Wait for the PyPI release to be visible
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "https://pypi.org/pypi/lucidshark/${version}/json"; then
              echo "lucidshark ${version} is on PyPI"
              exit 0
            fi
            echo "Waiting for PyPI (${i}/30)..."
            sleep 10
          done
          echo "::error::lucidshark ${version} did not appear on PyPI"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "${base_url}/${archive}"
          curl --fail --location --silent --show-error --output "${archive}.sigstore.json" "${base_url}/${archive}.sigstore.json"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "${archive}.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
